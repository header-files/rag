[project]
name = "llm"
version = "0.1.0"
description = "Multi-protocol LLM HTTP client with CLI chat"
readme = "README.md"
authors = [
    { name = "header-files", email = "1994707436@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
llm-chat = "llm.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/llm"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
